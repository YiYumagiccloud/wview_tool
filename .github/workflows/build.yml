name: 构建 Wview EXE

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（作为 Release 的 tag，例如 v2.0.0）'
        required: true
        default: 'v2.0.0'
        type: string
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: 编译并发布
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: 安装 Nuitka
        run: |
          python -m pip install --upgrade pip
          pip install nuitka
        shell: pwsh

      # 把 PNG/JPG 转成 Windows 能用的 ICO
      - name: 转换图标为 ICO
        run: |
          pip install Pillow
          python -c @"
          from PIL import Image
          img = Image.open('icon.png').convert('RGBA')
          img.save('icon.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          "@
        shell: pwsh

      - name: 用 Nuitka 编译
        run: |
          python -m nuitka `
            --standalone `
            --onefile `
            --msvc=latest `
            --assume-yes-for-downloads `
            --windows-console-mode=force `
            --windows-icon-from-ico=icon.ico `
            --output-dir=dist `
            --output-filename=Wview_v2.exe `
            --company-name="Wview Tool" `
            --product-name="Wview Unpacker" `
            --file-version=2.0.0.0 `
            --product-version=2.0.0.0 `
            wview_tool.py
        shell: pwsh

      - name: 上传构建产物到 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wview-v2-windows
          path: dist/Wview_v2.exe
          if-no-files-found: error

      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: Wview 解包工具 ${{ github.event.inputs.version || github.ref_name }}
          body: |
            ## Wview 解包工具 ${{ github.event.inputs.version || github.ref_name }}

            由 GitHub Actions 自动构建，基于 Nuitka 编译。

            ### 使用方法
            1. 下载下方的 `Wview_v2.exe`
            2. 改名为 `Wview-解包工具-v2.exe`（可选）
            3. 把 `.mview` 文件直接拖到 exe 上运行

            ### 提示
            * 首次启动可能稍慢（onefile 需要解压到临时目录）
            * 如需配置文件，可运行 `Wview_v2.exe --write-config` 生成模板
          files: dist/Wview_v2.exe
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
